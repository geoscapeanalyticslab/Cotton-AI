name: Precompute EE Field Data

on:
  # Manual only: the live dashboard queries Earth Engine in the browser, so
  # this precompute job is just a fallback snapshot generator.
  workflow_dispatch:
    inputs:
      years:
        description: 'Years to precompute (comma-separated, e.g. 2023,2024,2025,2026)'
        required: false
        default: '2018,2019,2020,2021,2022,2023,2024,2025,2026'

permissions:
  contents: write

jobs:
  precompute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install earthengine-api python-dotenv

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Earth Engine
        run: |
          gcloud auth activate-service-account --key-file=$GOOGLE_APPLICATION_CREDENTIALS
          # Register the service account for Earth Engine if not already done
          # Run once: earthengine authenticate --service-account

      - name: Run precompute
        env:
          EE_PROJECT: ${{ secrets.EE_PROJECT_ID }}
        run: python precompute_field_data.py

      - name: Copy precomputed data to docs
        run: cp static/data/field_*.json docs/data/

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/data/field_*.json docs/data/field_*.json
          git diff --staged --quiet || git commit -m "chore: precompute EE field data [skip ci]"
          git push
