name: Build and Deploy to GitHub Pages

# Builds the Vite app and commits the result into docs/, which is what
# GitHub Pages serves (Settings → Pages → Deploy from a branch → main /docs).
#
# This deliberately avoids actions/upload-pages-artifact so the deploy does
# not depend on the Actions artifact storage quota.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_EE_PROJECT: ${{ secrets.VITE_EE_PROJECT }}

      - name: Copy build into docs/
        run: |
          rm -rf docs/assets
          mkdir -p docs/assets
          cp -r frontend/dist/assets/. docs/assets/
          cp frontend/dist/*.html docs/

      - name: Commit updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Site is already up to date"
          else
            git commit -m "chore: rebuild site [skip ci]"
            git push
          fi
